name: CadGPT V5 Source CI

on:
  push:
    branches:
      - feature/core-function-v5
      - integration/v5-main-20261021
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Source regression suite
        run: npm test
