name: CadGPT Authoring Integrity

on:
  pull_request:
    branches: [main]

jobs:
  authoring-integrity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and build
        shell: pwsh
        run: |
          npm ci
          python scripts/generate-cad-tool-manifest.py
          npm test

      - name: Exercise canonical V5 authoring and Temp ownership through MCP
        run: node --test tests/v5-public-authoring.test.mjs tests/v5-source-continuation.test.mjs tests/v5-temp-continuation.test.mjs
