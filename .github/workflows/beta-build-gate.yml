name: CadGPT Runtime Roadmap Gate

on:
  pull_request:
    branches: [main]

jobs:
  runtime-roadmap-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify current runtime roadmap and managed AppData contract
        shell: pwsh
        run: |
          foreach ($required in @(
            "package-lock.json",
            "runtimes/cad-mcp/requirements.lock.txt",
            "docs/roadmap/CADGPT-QUALITY-GATES-2026-10.md",
            "setup.bat",
            "run.bat",
            "knowledge/jobs/JOB_RULES.md",
            "resources/cad/CADGPT_LOAD_SMOKE.lsp"
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing Beta artifact: $required" }
          }
          $setup = Get-Content "scripts/setup-core.bat" -Raw
          $driver = Get-Content "setup.bat" -Raw
          if ($driver -notmatch 'scripts\\setup-core\.bat') { throw "Setup driver does not delegate to core" }
          foreach ($marker in @(
            "npm ci",
            "requirements.lock.txt",
            "CADGPT_APPDATA_ROOT",
            "libraries\lisp",
            "libraries\jobs",
            "registry\user",
            "workspace\lisp-draft",
            "workspace\job-draft",
            "data\runs",
            "runtime\dynamic-lisp",
            "drawings",
            "state",
            "logs"
          )) {
            if ($setup -notmatch [regex]::Escape($marker)) { throw "setup.bat missing managed-AppData marker: $marker" }
          }
          if ($setup -match "appdata\\libraries\\lisp") { throw "setup.bat must not hard-code the default AppData root as write authority" }
          Write-Host "Runtime roadmap and externally managed AppData contract OK"

      - name: Install locked Node dependencies
        run: npm ci

      - name: Generate stable CAD tool manifest
        run: python scripts/generate-cad-tool-manifest.py

      - name: Build and unit tests
        run: npm test

      - name: Exercise canonical V5 authoring and Temp ownership through MCP
        run: node --test tests/v5-public-authoring.test.mjs tests/v5-source-continuation.test.mjs tests/v5-temp-continuation.test.mjs
