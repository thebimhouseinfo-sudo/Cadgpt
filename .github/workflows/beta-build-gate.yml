name: CadGPT Beta Build Gate

on:
  pull_request:
    branches: [main]

jobs:
  beta-build-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify beta dependency/AppData contract
        shell: pwsh
        run: |
          foreach ($required in @(
            "package-lock.json",
            "runtimes/cad-mcp/requirements.lock.txt",
            "ROADMAP.md",
            "setup.bat",
            "run.bat",
            "appdata/README.md",
            "knowledge/jobs/JOB_RULES.md",
            "resources/cad/CADGPT_LOAD_SMOKE.lsp",
            "appdata/registry/user/capabilities.json",
            "appdata/registry/user/libraries.json"
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing Beta artifact: $required" }
          }
          $setup = Get-Content "setup.bat" -Raw
          foreach ($marker in @(
            "npm ci",
            "requirements.lock.txt",
            "appdata\libraries\lisp",
            "appdata\libraries\jobs",
            "appdata\registry\user",
            "appdata\workspace\lisp-draft",
            "appdata\data\runs"
          )) {
            if ($setup -notmatch [regex]::Escape($marker)) { throw "setup.bat missing managed-AppData marker: $marker" }
          }
          Write-Host "Beta managed AppData contract OK"

      - name: Install locked Node dependencies
        run: npm ci

      - name: Generate stable CAD tool manifest
        run: python scripts/generate-cad-tool-manifest.py

      - name: Build connector
        run: npm run build

      - name: Exercise libraries, registry and write-lisp through MCP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path @(
            "appdata/libraries/lisp",
            "appdata/libraries/jobs",
            "appdata/registry/user",
            "appdata/workspace/lisp-draft",
            "appdata/workspace/job-draft",
            "appdata/data/runs",
            "appdata/runtime/dynamic-lisp",
            "appdata/state",
            "appdata/logs"
          ) | Out-Null

          $external = Join-Path $env:RUNNER_TEMP "cadgpt-external-lisp"
          Remove-Item $external -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $external | Out-Null
          $externalSource = @(
            ";;; user's original source - must remain byte-for-byte unchanged",
            "(defun c:USERHELLO (/)",
            '  (princ "\nhello")',
            "  (princ))",
            "(princ)"
          ) -join "`n"
          $externalFile = Join-Path $external "UserHello.lsp"
          Set-Content -LiteralPath $externalFile -Value $externalSource -NoNewline -Encoding UTF8
          $sourceHashBefore = (Get-FileHash $externalFile -Algorithm SHA256).Hash

          $env:CAD_MCP_PYTHON = "python"
          $env:CAD_MCP_ENTRY = "runtimes\cad-mcp\main.py"
          $env:MCP_TOKEN = "beta-gate-token"
          $env:CADGPT_APPDATA_ROOT = "appdata"
          $mcpUrl = "http://127.0.0.1:3000/mcp/beta-gate-token"
          $proc = Start-Process -FilePath "node" -ArgumentList "dist/index.js" -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..40) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3000/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "CadGPT did not become ready" }

            $headers = @{ Accept = "application/json, text/event-stream" }
            $init = @{
              jsonrpc = "2.0"; id = 1; method = "initialize";
              params = @{ protocolVersion = "2025-06-18"; capabilities = @{}; clientInfo = @{ name = "cadgpt-beta-gate"; version = "0.1.0" } }
            } | ConvertTo-Json -Depth 10
            $initResp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $headers -ContentType "application/json" -Body $init
            $sessionId = $initResp.Headers["Mcp-Session-Id"]
            if (-not $sessionId) { throw "No MCP session id" }
            $mcpHeaders = @{ Accept="application/json, text/event-stream"; "Mcp-Session-Id"=$sessionId; "Mcp-Protocol-Version"="2025-06-18" }
            $null = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body (@{ jsonrpc="2.0"; method="notifications/initialized" } | ConvertTo-Json)

            $script:RpcId = 10
            function Invoke-Mcp([string]$Method, $Params) {
              $script:RpcId += 1
              $body = @{ jsonrpc="2.0"; id=$script:RpcId; method=$Method; params=$Params } | ConvertTo-Json -Depth 30
              $resp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body $body
              return ($resp.Content | ConvertFrom-Json)
            }
            function Invoke-Tool([string]$Name, $Arguments) { return Invoke-Mcp "tools/call" @{ name=$Name; arguments=$Arguments } }

            $tools = Invoke-Mcp "tools/list" @{}
            $toolNames = @($tools.result.tools | ForEach-Object { $_.name })
            foreach ($requiredTool in @(
              "library_list", "library_import", "registry_list", "registry_get",
              "lisp_scaffold", "lisp_checkout", "lisp_validate", "lisp_draft_validate", "lisp_promote_draft"
            )) {
              if ($toolNames -notcontains $requiredTool) { throw "Missing managed-library/write-lisp tool: $requiredTool" }
            }

            $roots = Invoke-Tool "file_roots" @{}
            $rootNames = @($roots.result.structuredContent.data.roots)
            foreach ($requiredRoot in @("appdata/data", "appdata/libraries", "appdata/workspace")) {
              if ($rootNames -notcontains $requiredRoot) { throw "file_roots missing managed root: $requiredRoot" }
            }
            foreach ($forbidden in @("lisp", "jobs")) {
              if ($rootNames -contains $forbidden) { throw "Legacy repo root is still exposed: $forbidden" }
            }

            $imported = Invoke-Tool "library_import" @{
              kind="lisp"; library_id="ci-user-lib"; name="CI User Library"; source_path=$external;
              user_approved_source=$true; replace_existing=$true
            }
            if ($imported.result.isError -eq $true -or $imported.result.structuredContent.ok -ne $true) { throw "library_import failed" }
            $sourceHashAfter = (Get-FileHash $externalFile -Algorithm SHA256).Hash
            if ($sourceHashBefore -ne $sourceHashAfter) { throw "External user source was modified during import" }
            if (-not (Test-Path "appdata/libraries/lisp/ci-user-lib/UserHello.lsp")) { throw "Managed copy was not created" }

            $userCap = Invoke-Tool "registry_get" @{ id="USERHELLO"; kind="lisp" }
            if ($userCap.result.isError -eq $true -or $userCap.result.structuredContent.data.entry.library_id -ne "ci-user-lib") { throw "Imported Lisp not indexed in User Registry" }
            if ($userCap.result.structuredContent.data.entry.semantic_status -ne "indexed") { throw "Fresh import should remain indexed/unmodified, not pretend curated" }

            $scaffold = Invoke-Tool "lisp_scaffold" @{
              file_name="Beta Smoke.lsp"; module="CadGPT Beta Gate"; command="BETASMOKE";
              description="Static beta scaffold smoke test"; mutating=$false; uses_com=$false
            }
            $scaffoldSource = $scaffold.result.structuredContent.data.content
            if ($scaffoldSource -notmatch "CADGPT-HEADER-START" -or $scaffoldSource -match "TBH-HEADER-START") { throw "Default scaffold is not CadGPT-native" }

            $tbhScaffold = Invoke-Tool "lisp_scaffold" @{
              file_name="TBH Smoke.lsp"; module="Beta"; command="TBHSMOKE";
              description="TBH exception"; target_library_id="tbh-toolkit"; mutating=$false; uses_com=$false
            }
            if ($tbhScaffold.result.structuredContent.data.content -notmatch "TBH-HEADER-START") { throw "TBH authoring exception missing" }

            $checkout = Invoke-Tool "lisp_checkout" @{ registry_id="ci-user-lib.lisp.userhello"; description="User hello edited by CadGPT" }
            if ($checkout.result.isError -eq $true -or $checkout.result.structuredContent.ok -ne $true) { throw "lisp_checkout failed" }
            $draftPath = $checkout.result.structuredContent.data.draft_path
            $draft = Get-Content ($draftPath -replace '^appdata/', 'appdata/') -Raw
            if ($draft -notmatch "CADGPT-HEADER-START") { throw "Non-TBH checkout did not normalize draft to CadGPT header" }
            if ((Get-FileHash $externalFile -Algorithm SHA256).Hash -ne $sourceHashBefore) { throw "External source changed after checkout" }

            $draftValid = Invoke-Tool "lisp_draft_validate" @{ path=$draftPath; expected_commands=@("USERHELLO"); profile="cadgpt" }
            if ($draftValid.result.structuredContent.data.valid -ne $true) { throw "CadGPT checkout draft failed validation" }

            $managedValid = Invoke-Tool "lisp_validate" @{
              path="appdata/libraries/lisp/tbh-toolkit/Setup Xref/XRlayer.lsp"; expected_commands=@("XRLAYER"); profile="syntax"
            }
            if ($managedValid.result.structuredContent.data.valid -ne $true) { throw "Untouched imported Lisp should pass syntax validation without header normalization" }

            $badPath = "appdata/workspace/lisp-draft/CI_BAD.lsp"
            $bad = $scaffoldSource -replace "\(defun c:BETASMOKE \(/ \)", "(defun c:BETASMOKE (/ x)`n  (let ((x 1)) (princ x))"
            $created = Invoke-Tool "file_create" @{ path=$badPath; content=$bad }
            if ($created.result.isError -eq $true) { throw "Could not create Common Lisp reject fixture" }
            $invalid = Invoke-Tool "lisp_draft_validate" @{ path=$badPath; expected_commands=@("BETASMOKE"); profile="cadgpt" }
            if ($invalid.result.structuredContent.data.valid -ne $false) { throw "Common Lisp form was not rejected" }
            $codes = @($invalid.result.structuredContent.data.diagnostics | ForEach-Object { $_.code })
            if ($codes -notcontains "COMMON_LISP_FORM") { throw "COMMON_LISP_FORM diagnostic missing" }

            Write-Host "managed-library/User Registry/write-lisp MCP gate passed"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
