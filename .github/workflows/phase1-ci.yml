name: CadGPT Core CI

on:
  push:
    branches: ['phase*', 'beta-review-*']
  pull_request:
    branches: [main]

jobs:
  connector-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Generate stable CAD tool manifest
        run: python scripts/generate-cad-tool-manifest.py
      - name: Verify manifest
        shell: pwsh
        run: |
          $manifest = Get-Content "runtimes/cad-mcp/tool-manifest.json" -Raw | ConvertFrom-Json
          if (@($manifest.tools).Count -lt 1) { throw "Generated CAD tool manifest is empty" }
          if (@($manifest.tools.name) -notcontains "cad_list_layers") { throw "CAD manifest missing cad_list_layers" }
      - name: Build connector
        run: npm run build
      - name: Validate PowerShell launcher scripts
        shell: pwsh
        run: |
          foreach ($script in @("agent-task.ps1", "start.ps1", "openai-tunnel.ps1", "doctor.ps1", "acceptance.ps1")) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell parse failed: $script"
            }
          }
      - name: Smoke protected MCP, managed sandbox, registry, stable CAD descriptors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path @(
            "appdata/libraries/lisp", "appdata/libraries/jobs", "appdata/registry/user",
            "appdata/workspace/lisp-draft", "appdata/workspace/job-draft", "appdata/data/runs",
            "appdata/runtime/dynamic-lisp", "appdata/state", "appdata/logs"
          ) | Out-Null
          $env:CAD_MCP_PYTHON = "python"
          $env:CAD_MCP_ENTRY = "runtimes\cad-mcp\main.py"
          $env:MCP_TOKEN = "ci-secret-token"
          $env:CADGPT_CONTROL_TOKEN = "ci-internal-control"
          $env:CADGPT_SESSION_IDLE_MS = "600000"
          $env:CADGPT_APPDATA_ROOT = "appdata"
          $mcpUrl = "http://127.0.0.1:3000/mcp/ci-secret-token"
          $proc = Start-Process -FilePath "node" -ArgumentList "dist/index.js" -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..40) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3000/health" -TimeoutSec 1
                if ($health.status -eq "ok" -and $health.name -eq "cadgpt") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "CadGPT /health did not become ready" }
            if ($health.mcp_path_protected -ne $true) { throw "MCP path protection inactive" }
            if ($health.cad_mcp.connected -eq $true) { throw "CAD MCP unexpectedly started without AutoCAD" }

            $rawStatus = (Invoke-WebRequest -Uri "http://127.0.0.1:3000/mcp" -Method Get -SkipHttpErrorCheck).StatusCode
            if ($rawStatus -ne 404) { throw "Unprotected /mcp route returned HTTP $rawStatus" }
            $controlStatus = (Invoke-WebRequest -Uri "http://127.0.0.1:3000/internal/cad/deactivate" -Method Post -ContentType "application/json" -Body "{}" -SkipHttpErrorCheck).StatusCode
            if ($controlStatus -ne 404) { throw "Internal CAD lifecycle endpoint accepted missing control token" }

            $headers = @{ Accept = "application/json, text/event-stream" }
            $initBody = @{
              jsonrpc="2.0"; id=1; method="initialize";
              params=@{ protocolVersion="2025-06-18"; capabilities=@{}; clientInfo=@{ name="cadgpt-ci"; version="0.1.0" } }
            } | ConvertTo-Json -Depth 10
            $initResp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $headers -ContentType "application/json" -Body $initBody
            $sessionId = $initResp.Headers["Mcp-Session-Id"]
            if (-not $sessionId) { throw "MCP initialize returned no session id" }
            $mcpHeaders = @{ Accept="application/json, text/event-stream"; "Mcp-Session-Id"=$sessionId; "Mcp-Protocol-Version"="2025-06-18" }
            $null = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body (@{ jsonrpc="2.0"; method="notifications/initialized" } | ConvertTo-Json)

            function Invoke-Mcp([int]$Id, [string]$Method, $Params) {
              $body = @{ jsonrpc="2.0"; id=$Id; method=$Method; params=$Params } | ConvertTo-Json -Depth 20
              $resp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body $body
              return ($resp.Content | ConvertFrom-Json)
            }

            $toolsJson = Invoke-Mcp 2 "tools/list" @{}
            $names = @($toolsJson.result.tools | ForEach-Object { $_.name })
            foreach ($required in @(
              "file_roots", "file_read", "file_search", "library_list", "library_import",
              "registry_list", "registry_get", "job_list", "job_get", "skill_list", "skill_get",
              "lisp_scaffold", "lisp_checkout", "lisp_validate", "lisp_draft_validate", "lisp_promote_draft",
              "cad_status", "drawing_list", "drawing_create_test", "drawing_bind", "drawing_status",
              "cad__cad_list_layers"
            )) {
              if ($names -notcontains $required) { throw "Missing MCP tool: $required" }
            }

            $roots = Invoke-Mcp 3 "tools/call" @{ name="file_roots"; arguments=@{} }
            $rootNames = @($roots.result.structuredContent.data.roots)
            foreach ($required in @("appdata/data", "appdata/libraries", "appdata/workspace")) {
              if ($rootNames -notcontains $required) { throw "Managed root missing: $required" }
            }
            foreach ($legacy in @("lisp", "jobs")) {
              if ($rootNames -contains $legacy) { throw "Legacy repo root remains editable: $legacy" }
            }

            $allowedRead = Invoke-Mcp 4 "tools/call" @{ name="file_read"; arguments=@{ path="appdata/libraries/jobs/tbh-toolkit/JOB.md"; start_line=1; end_line=2 } }
            if ($allowedRead.result.isError -eq $true -or $allowedRead.result.structuredContent.ok -ne $true) { throw "Managed AppData read rejected" }

            $blockedRead = Invoke-Mcp 5 "tools/call" @{ name="file_read"; arguments=@{ path="package.json" } }
            if ($blockedRead.result.isError -ne $true) { throw "Sandbox allowed package.json" }
            $legacyRead = Invoke-Mcp 6 "tools/call" @{ name="file_read"; arguments=@{ path="jobs/JOB_RULES.md" } }
            if ($legacyRead.result.isError -ne $true) { throw "Sandbox still allows legacy jobs source root" }

            $registry = Invoke-Mcp 7 "tools/call" @{ name="registry_list"; arguments=@{ limit=500 } }
            $entries = @($registry.result.structuredContent.data.entries)
            if (@($entries | Where-Object { $_.registry -eq "internal" -and $_.kind -eq "tool" }).Count -lt 1) { throw "Internal tool registry empty" }
            if (@($entries | Where-Object { $_.registry -eq "internal" -and $_.kind -eq "skill" }).Count -lt 1) { throw "Internal skill registry empty" }
            if (@($entries | Where-Object { $_.registry -eq "user" -and $_.kind -eq "lisp" }).Count -lt 1) { throw "User Lisp registry empty" }
            if (@($entries | Where-Object { $_.registry -eq "user" -and $_.kind -eq "job" }).Count -lt 1) { throw "User Job registry empty" }

            $recoveryHeaders = @{ Accept="application/json, text/event-stream"; "Mcp-Session-Id"="ci-stale-session"; "Mcp-Protocol-Version"="2025-06-18" }
            $recoveryBody = @{ jsonrpc="2.0"; id=8; method="tools/list"; params=@{} } | ConvertTo-Json -Depth 5
            $recoveryResp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $recoveryHeaders -ContentType "application/json" -Body $recoveryBody
            $recoveryJson = $recoveryResp.Content | ConvertFrom-Json
            if (@($recoveryJson.result.tools | ForEach-Object { $_.name }) -notcontains "cad__cad_list_layers") { throw "Stable CAD descriptors disappeared during recovery" }

            Write-Host "Protected MCP + managed sandbox + split registry + stable descriptor smoke passed"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

  cad-runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify direct requirements are represented in lock
        shell: pwsh
        run: |
          $direct = @(Get-Content "runtimes/cad-mcp/requirements.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          $locked = @(Get-Content "runtimes/cad-mcp/requirements.lock.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          foreach ($dep in $direct) { if ($locked -notcontains $dep) { throw "Python lock missing direct dependency: $dep" } }
      - name: Install locked CAD MCP dependencies
        run: python -m pip install -r runtimes/cad-mcp/requirements.lock.txt
      - name: Validate Python dependency graph
        run: python -m pip check
      - name: Compile CAD MCP slice
        run: python -m compileall -q runtimes/cad-mcp scripts/generate-cad-tool-manifest.py
      - name: Generate CAD tool manifest without starting runtime
        run: python scripts/generate-cad-tool-manifest.py
      - name: Import CAD MCP entrypoint
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\runtimes\cad-mcp"
          python -c "import main; print('cad-mcp import ok')"
