name: CadGPT Core CI

on:
  push:
    branches: [main, 'phase*', 'beta-review-*']
  pull_request:
    branches: [main]

jobs:
  connector-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard retired legacy runtime surface
        shell: pwsh
        run: |
          foreach ($retired in @(
            "start.ps1",
            "agent-task.ps1",
            "src/wake-agent.ts",
            "config/README.md",
            "src/cadgpt/commands/README.md",
            "src/cadgpt/file_tools/README.md",
            "src/cadgpt/job_runtime/README.md",
            "src/cadgpt/launcher/README.md",
            "src/cadgpt/skill_runtime/README.md"
          )) {
            if (Test-Path -LiteralPath $retired) {
              throw "Retired legacy/placeholder surface reintroduced: $retired"
            }
          }

          $legacyPatterns = @(
            "codex-hooks",
            "ponytail",
            "mcp-upstream",
            "Computer Use",
            "project-memory"
          )
          $activeFiles = @(
            Get-ChildItem "src" -Recurse -File -Include *.ts,*.js -ErrorAction SilentlyContinue
          )
          foreach ($file in $activeFiles) {
            $text = Get-Content -LiteralPath $file.FullName -Raw -ErrorAction SilentlyContinue
            foreach ($pattern in $legacyPatterns) {
              if ($text -and $text.IndexOf($pattern, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "Retired inherited runtime marker '$pattern' found in active source: $($file.FullName)"
              }
            }
          }

          foreach ($required in @("setup.bat", "run.bat", "cadgpt-tray.vbs", "cadgpt-tray.ps1", "openai-tunnel.ps1")) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required lightweight runtime entrypoint missing: $required"
            }
          }
          Write-Host "Legacy cleanup boundary and lightweight startup surface OK"
      - name: Install locked dependencies
        run: npm ci
      - name: Generate stable CAD tool manifest
        run: python scripts/generate-cad-tool-manifest.py
      - name: Verify manifest
        shell: pwsh
        run: |
          $manifest = Get-Content "runtimes/cad-mcp/tool-manifest.json" -Raw | ConvertFrom-Json
          if (@($manifest.tools).Count -lt 1) { throw "Generated CAD tool manifest is empty" }
          if (@($manifest.tools.name) -notcontains "cad_list_layers") { throw "CAD manifest missing cad_list_layers" }
      - name: Build and unit tests
        run: npm test
      - name: Validate PowerShell launcher scripts
        shell: pwsh
        run: |
          foreach ($script in @("cadgpt-tray.ps1", "wait-tray-ready.ps1", "openai-tunnel.ps1", "doctor.ps1", "acceptance.ps1")) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell parse failed: $script"
            }
          }
      - name: Guard Doctor AppData resolution contract
        shell: pwsh
        run: |
          $doctor = Get-Content "doctor.ps1" -Raw
          if ($doctor -notmatch [regex]::Escape('if ($appDataConfigured -eq "appdata") { $appDataConfigured = $null }')) {
            throw "doctor.ps1 no longer maps legacy CADGPT_APPDATA_ROOT=appdata to the LocalAppData default"
          }
          if ($doctor -notmatch [regex]::Escape('(Join-Path $env:LOCALAPPDATA "CadGPT")')) {
            throw "doctor.ps1 no longer uses %LOCALAPPDATA%\CadGPT as its default runtime data root"
          }
          Write-Host "Doctor AppData resolution matches runtime legacy/default contract"

      - name: Smoke admission, lazy families, managed sandbox and registry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path @(
            "appdata/libraries/lisp", "appdata/libraries/jobs", "appdata/registry/user",
            "appdata/workspace/lisp-draft", "appdata/workspace/job-draft", "appdata/data/runs",
            "appdata/runtime/dynamic-lisp", "appdata/drawings", "appdata/state", "appdata/logs"
          ) | Out-Null

          $env:CAD_MCP_PYTHON = "python"
          $env:CAD_MCP_ENTRY = "runtimes\cad-mcp\main.py"
          $env:MCP_TOKEN = "ci-secret-token"
          $env:CADGPT_APPDATA_ROOT = (Resolve-Path "appdata").Path
          $env:CADGPT_BUILD_PROFILE = "development"
          $mcpUrl = "http://127.0.0.1:3000/mcp/ci-secret-token"
          $proc = Start-Process -FilePath "node" -ArgumentList "dist/index.js" -PassThru -NoNewWindow

          try {
            $ready = $false
            foreach ($i in 1..40) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3000/health" -TimeoutSec 1
                if ($health.status -eq "ok" -and $health.name -eq "cadgpt") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "CadGPT /health did not become ready" }
            if ($health.mode -ne "slim-control-plane") { throw "CadGPT did not start in slim control mode" }
            if (@($health.loaded_families).Count -ne 0) { throw "Heavy families loaded before admission" }
            if ($health.cad_mcp.connected -eq $true) { throw "CAD MCP unexpectedly started at idle" }

            $headers = @{ Accept = "application/json, text/event-stream" }
            $initBody = @{
              jsonrpc="2.0"; id=1; method="initialize";
              params=@{ protocolVersion="2025-06-18"; capabilities=@{}; clientInfo=@{ name="cadgpt-ci"; version="0.2.0" } }
            } | ConvertTo-Json -Depth 10
            $initResp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $headers -ContentType "application/json" -Body $initBody
            $sessionId = @($initResp.Headers["Mcp-Session-Id"])[0]
            if (-not $sessionId) { throw "MCP initialize returned no session id" }
            $mcpHeaders = @{ Accept="application/json, text/event-stream"; "Mcp-Session-Id"=$sessionId; "Mcp-Protocol-Version"="2025-06-18" }
            $null = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body (@{ jsonrpc="2.0"; method="notifications/initialized" } | ConvertTo-Json)

            $script:RpcId = 10
            function Invoke-Mcp([string]$Method, $Params) {
              $script:RpcId += 1
              $body = @{ jsonrpc="2.0"; id=$script:RpcId; method=$Method; params=$Params } | ConvertTo-Json -Depth 30
              $resp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body $body
              return ($resp.Content | ConvertFrom-Json)
            }
            function Invoke-Tool([string]$Name, $Arguments=@{}) {
              return Invoke-Mcp "tools/call" @{ name=$Name; arguments=$Arguments }
            }

            $initial = Invoke-Mcp "tools/list" @{}
            $initialNames = @($initial.result.tools | ForEach-Object { $_.name })
            foreach ($required in @("cadgpt_control","cadgpt_admission","cadgpt_work_start","cadgpt_work_status","cadgpt_work_stop")) {
              if ($initialNames -notcontains $required) { throw "Missing slim control tool: $required" }
            }
            if ($initialNames -contains "file_roots" -or $initialNames -contains "drawing_list") { throw "Execution tools leaked into pre-admission surface" }

            $inactive = Invoke-Tool "cadgpt_admission" @{ user_turn="inspect this drawing"; invocation_source="mention" }
            if ($inactive.result.structuredContent.data.mode -ne "inactive") { throw "Unclaimed session should remain inactive before explicit CadGPT launch" }

            $admit = Invoke-Tool "cadgpt_admission" @{ user_turn="CG"; invocation_source="plugin" }
            if ($admit.result.structuredContent.render_verbatim -ne $true) { throw "Bare plugin launch did not request verbatim Welcome rendering" }
            $welcome = [string]$admit.result.structuredContent.welcome_text
            foreach ($section in @("CAD","WORKSPACE","COMMANDS")) {
              if ($welcome -notmatch $section) { throw "Bare plugin launch missing Welcome section: $section" }
            }
            foreach ($command in @("cg/cl","cg/cj","cg/job","cg/")) {
              if ($welcome -notmatch [regex]::Escape($command)) { throw "Bare plugin launch missing Welcome command: $command" }
            }

            $idleStatus = Invoke-Tool "cadgpt_control" @{ surface="status" }
            if ([string]$idleStatus.result.structuredContent.text -notmatch "WORK\s+IDLE") { throw "CadGPT status did not report idle session directly" }

            $continued = Invoke-Tool "cadgpt_admission" @{ user_turn="inspect this drawing"; invocation_source="mention" }
            if ($continued.result.structuredContent.data.reason -ne "session_continuation") { throw "Claimed session did not continue without repeated @cadgpt" }

            $afterAdmission = Invoke-Mcp "tools/list" @{}
            $afterAdmissionNames = @($afterAdmission.result.tools | ForEach-Object { $_.name })
            foreach ($required in @("library_list","registry_list","job_list","job_get","skill_list","skill_get")) {
              if ($afterAdmissionNames -notcontains $required) { throw "Discovery family missing after admission: $required" }
            }
            foreach ($forbidden in @("file_roots","file_create","file_edit","asset_import","asset_export","asset_register_external","job_checkout","job_run_direct","job_draft_validate","job_promote_draft","lisp_checkout","drawing_list")) {
              if ($afterAdmissionNames -contains $forbidden) { throw "Execution/mutation tool leaked into admission-only discovery surface: $forbidden" }
            }

            $work = Invoke-Tool "cadgpt_work_start" @{ owner_type="skill"; owner_id="write-lisp"; execution_path="file" }
            $handle = $work.result.structuredContent.data.work_handle
            if (-not $handle.execution_id -or -not $handle.authority_token) { throw "Work handle missing" }
            $workAuth = @{ execution_id=[string]$handle.execution_id; authority_token=[string]$handle.authority_token }

            function Invoke-Work([string]$Name, $Arguments=@{}) {
              $merged=@{}
              foreach($k in $workAuth.Keys){$merged[$k]=$workAuth[$k]}
              foreach($k in $Arguments.Keys){$merged[$k]=$Arguments[$k]}
              return Invoke-Tool $Name $merged
            }
            function Invoke-Discovery([string]$Name, $Arguments=@{}) {
              return Invoke-Tool $Name $Arguments
            }

            $activeStatus = Invoke-Tool "cadgpt_control" @{ surface="status" }
            if ([string]$activeStatus.result.structuredContent.text -notmatch "WORK\s+ACTIVE") { throw "CadGPT status did not report active work directly" }

            $reused = Invoke-Tool "cadgpt_work_start" @{ owner_type="skill"; owner_id="write-lisp"; execution_path="file" }
            if ($reused.result.structuredContent.data.reused -ne $true) { throw "Compatible active work was not reused" }
            if ([string]$reused.result.structuredContent.data.work_handle.execution_id -ne [string]$handle.execution_id) { throw "Reused work changed execution id" }

            $afterWork = Invoke-Mcp "tools/list" @{}
            $names = @($afterWork.result.tools | ForEach-Object { $_.name })
            foreach ($required in @("file_roots","file_read","file_search","asset_import","asset_export","asset_register_external","lisp_scaffold","lisp_checkout","lisp_validate","job_run_direct")) {
              if ($names -notcontains $required) { throw "FILE work tool missing after work start: $required" }
            }
            if ($names -contains "drawing_list") { throw "CAD family loaded during FILE-only work" }

            $roots = Invoke-Work "file_roots"
            $rootNames = @($roots.result.structuredContent.data.roots)
            foreach ($required in @("appdata/data", "appdata/libraries", "appdata/workspace")) {
              if ($rootNames -notcontains $required) { throw "Managed root missing: $required" }
            }

            $allowedRead = Invoke-Work "file_read" @{ path="appdata/libraries/jobs/tbh-toolkit/JOB.md"; start_line=1; end_line=2 }
            if ($allowedRead.result.isError -eq $true) { throw "Managed AppData read rejected" }
            $blockedRead = Invoke-Work "file_read" @{ path="package.json" }
            if ($blockedRead.result.isError -ne $true) { throw "Sandbox allowed package.json" }

            $registry = Invoke-Discovery "registry_list" @{ limit=500 }
            $entries = @($registry.result.structuredContent.data.entries)
            if (@($entries | Where-Object { $_.registry -eq "internal" -and $_.kind -eq "tool" }).Count -lt 1) { throw "Internal tool registry empty" }
            if (@($entries | Where-Object { $_.registry -eq "internal" -and $_.kind -eq "skill" }).Count -lt 1) { throw "Internal skill registry empty" }
            if (@($entries | Where-Object { $_.registry -eq "user" -and $_.kind -eq "lisp" }).Count -lt 1) { throw "User Lisp registry empty" }
            if (@($entries | Where-Object { $_.registry -eq "user" -and $_.kind -eq "job" }).Count -lt 1) { throw "User Job registry empty" }

            $relativeCreate = Invoke-Work "file_create" @{ path="appdata/workspace/reject.txt"; content="reject" }
            if ($relativeCreate.result.isError -ne $true -or $relativeCreate.result.structuredContent.data.error -notmatch "ABSOLUTE_PATH_REQUIRED") { throw "Relative file mutation was not rejected" }

            Write-Host "Session + reusable work + lazy family + managed sandbox smoke passed"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

  cad-runtime-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify direct requirements are represented in lock
        shell: pwsh
        run: |
          $direct = @(Get-Content "runtimes/cad-mcp/requirements.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          $locked = @(Get-Content "runtimes/cad-mcp/requirements.lock.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          foreach ($dep in $direct) { if ($locked -notcontains $dep) { throw "Python lock missing direct dependency: $dep" } }
      - name: Install locked CAD MCP dependencies
        run: python -m pip install -r runtimes/cad-mcp/requirements.lock.txt
      - name: Validate Python dependency graph
        run: python -m pip check
      - name: Compile CAD MCP slice
        run: python scripts/check-cad-mcp-python.py
      - name: Generate CAD tool manifest without starting runtime
        run: python scripts/generate-cad-tool-manifest.py
      - name: Import CAD MCP entrypoint
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\runtimes\cad-mcp"
          python -c "import main; print('cad-mcp import ok')"

      - name: Verify Lisp absolute-path sandbox contract
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\runtimes\cad-mcp"
          $fixture = (Resolve-Path "resources\cad\CADGPT_LOAD_SMOKE.lsp").Path
          $env:CADGPT_LISP_FIXTURE = $fixture
          python -c "import os; from services.lisp_service import _resolve_lisp_path; p,v=_resolve_lisp_path(os.environ['CADGPT_LISP_FIXTURE']); assert os.path.isabs(p); assert v.replace('\\','/').startswith('resources/cad/'); print('approved absolute Lisp path OK')"

          $outside = Join-Path $env:RUNNER_TEMP "cadgpt-outside-load.lsp"
          Set-Content -LiteralPath $outside -Value "(princ)" -NoNewline
          $env:CADGPT_LISP_OUTSIDE = $outside
          python -c "import os; from services.lisp_service import _resolve_lisp_path; _resolve_lisp_path(os.environ['CADGPT_LISP_OUTSIDE'])" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "outside absolute Lisp path was accepted" }
          Write-Host "outside absolute Lisp path rejected"
          exit 0
