name: CadGPT Core CI

on:
  push:
    branches: ['phase*', 'beta-review-*']
  pull_request:
    branches: [main]

jobs:
  connector-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Generate stable CAD tool manifest
        run: python scripts/generate-cad-tool-manifest.py
      - name: Verify manifest exists and contains CAD tools
        shell: pwsh
        run: |
          $manifest = Get-Content "runtimes/cad-mcp/tool-manifest.json" -Raw | ConvertFrom-Json
          if (@($manifest.tools).Count -lt 1) { throw "Generated CAD tool manifest is empty" }
          if (@($manifest.tools.name) -notcontains "cad_list_layers") { throw "CAD manifest is missing cad_list_layers" }
          Write-Host "Stable CAD manifest contains $(@($manifest.tools).Count) upstream tool descriptors."
      - name: Build connector
        run: npm run build
      - name: Validate PowerShell launcher scripts
        shell: pwsh
        run: |
          foreach ($script in @("agent-task.ps1", "start.ps1", "openai-tunnel.ps1", "doctor.ps1", "acceptance.ps1")) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell parse failed: $script"
            }
            Write-Host "PowerShell parse OK: $script"
          }
      - name: Smoke test protected HTTP MCP surface, recovery, file sandbox, and stable CAD descriptors
        shell: pwsh
        run: |
          $env:CAD_MCP_PYTHON = "python"
          $env:CAD_MCP_ENTRY = "runtimes\cad-mcp\main.py"
          $env:MCP_TOKEN = "ci-secret-token"
          $env:CADGPT_CONTROL_TOKEN = "ci-internal-control"
          $env:CADGPT_SESSION_IDLE_MS = "600000"
          $mcpUrl = "http://127.0.0.1:3000/mcp/ci-secret-token"
          $proc = Start-Process -FilePath "node" -ArgumentList "dist/index.js" -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..40) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3000/health" -Method Get -TimeoutSec 1
                if ($health.status -eq "ok" -and $health.name -eq "cadgpt") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "CadGPT /health did not become ready" }
            if ($health.mcp_path_protected -ne $true) { throw "MCP path protection is not active" }
            if (@($health.mcp_paths) -notcontains "/mcp/ci-secret-token") { throw "Protected MCP path is not reported by health" }
            if ($health.cad_mcp.connected -eq $true) { throw "CAD MCP unexpectedly started without AutoCAD host activation" }

            $rawStatus = (Invoke-WebRequest -Uri "http://127.0.0.1:3000/mcp" -Method Get -SkipHttpErrorCheck).StatusCode
            if ($rawStatus -ne 404) { throw "Unprotected /mcp route unexpectedly returned HTTP $rawStatus" }
            $controlStatus = (Invoke-WebRequest -Uri "http://127.0.0.1:3000/internal/cad/deactivate" -Method Post -ContentType "application/json" -Body "{}" -SkipHttpErrorCheck).StatusCode
            if ($controlStatus -ne 404) { throw "Internal CAD lifecycle endpoint accepted a request without the ephemeral control token" }

            $headers = @{ Accept = "application/json, text/event-stream" }
            $initBody = @{
              jsonrpc = "2.0"
              id = 1
              method = "initialize"
              params = @{
                protocolVersion = "2025-06-18"
                capabilities = @{}
                clientInfo = @{ name = "cadgpt-ci"; version = "0.1.0" }
              }
            } | ConvertTo-Json -Depth 10
            $initResp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $headers -ContentType "application/json" -Body $initBody
            if ($initResp.StatusCode -ne 200) { throw "MCP initialize failed" }
            $sessionId = $initResp.Headers["Mcp-Session-Id"]
            if (-not $sessionId) { throw "MCP initialize returned no session id" }

            $mcpHeaders = @{
              Accept = "application/json, text/event-stream"
              "Mcp-Session-Id" = $sessionId
              "Mcp-Protocol-Version" = "2025-06-18"
            }
            $initializedBody = @{ jsonrpc = "2.0"; method = "notifications/initialized" } | ConvertTo-Json
            $null = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body $initializedBody

            function Invoke-Mcp([int]$Id, [string]$Method, $Params) {
              $body = @{ jsonrpc = "2.0"; id = $Id; method = $Method; params = $Params } | ConvertTo-Json -Depth 12
              $resp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $mcpHeaders -ContentType "application/json" -Body $body
              if ($resp.StatusCode -ne 200) { throw "MCP call failed: $Method" }
              return ($resp.Content | ConvertFrom-Json)
            }

            $toolsJson = Invoke-Mcp 2 "tools/list" @{}
            $names = @($toolsJson.result.tools | ForEach-Object { $_.name })
            foreach ($required in @(
              "file_roots", "file_read", "file_search",
              "job_list", "job_get",
              "skill_list", "skill_get", "lisp_scaffold", "lisp_validate",
              "cad_status", "drawing_list", "drawing_create_test", "drawing_bind", "drawing_status",
              "cad__cad_list_layers"
            )) {
              if ($names -notcontains $required) { throw "Missing MCP tool: $required" }
            }

            $cadStatus = Invoke-Mcp 3 "tools/call" @{ name = "cad_status"; arguments = @{} }
            if ($cadStatus.result.structuredContent.connected -eq $true) { throw "cad_status reports connected while CAD MCP should be sleeping" }

            $allowedRead = Invoke-Mcp 4 "tools/call" @{ name = "file_read"; arguments = @{ path = "jobs/JOB_RULES.md"; start_line = 1; end_line = 2 } }
            if ($allowedRead.result.isError -eq $true -or $allowedRead.result.structuredContent.ok -ne $true) {
              throw "Sandbox rejected an allowed jobs/** read"
            }

            $blockedRead = Invoke-Mcp 5 "tools/call" @{ name = "file_read"; arguments = @{ path = "package.json" } }
            if ($blockedRead.result.isError -ne $true -or $blockedRead.result.structuredContent.ok -ne $false) {
              throw "Sandbox allowed package.json outside jobs/** and lisp/**"
            }

            $traversalRead = Invoke-Mcp 6 "tools/call" @{ name = "file_read"; arguments = @{ path = "jobs/../package.json" } }
            if ($traversalRead.result.isError -ne $true -or $traversalRead.result.structuredContent.ok -ne $false) {
              throw "Sandbox allowed path traversal outside jobs/** and lisp/**"
            }

            $recoveryHeaders = @{
              Accept = "application/json, text/event-stream"
              "Mcp-Session-Id" = "ci-stale-session"
              "Mcp-Protocol-Version" = "2025-06-18"
            }
            $recoveryBody = @{ jsonrpc = "2.0"; id = 7; method = "tools/list"; params = @{} } | ConvertTo-Json -Depth 5
            $recoveryResp = Invoke-WebRequest -Uri $mcpUrl -Method Post -Headers $recoveryHeaders -ContentType "application/json" -Body $recoveryBody
            if ($recoveryResp.StatusCode -ne 200) { throw "MCP stale-session recovery returned HTTP $($recoveryResp.StatusCode)" }
            $recoveryJson = $recoveryResp.Content | ConvertFrom-Json
            if (@($recoveryJson.result.tools).Count -lt 1) { throw "Recovered MCP session returned no tools" }
            $recoveredNames = @($recoveryJson.result.tools | ForEach-Object { $_.name })
            if ($recoveredNames -notcontains "cad__cad_list_layers") { throw "Stable CAD descriptors disappeared during session recovery" }

            Write-Host "Protected HTTP MCP + recovery + sandbox + stable CAD descriptor smoke passed; tools=$($names.Count)"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

  cad-runtime-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify direct requirements are represented in lock
        shell: pwsh
        run: |
          $direct = @(Get-Content "runtimes/cad-mcp/requirements.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          $locked = @(Get-Content "runtimes/cad-mcp/requirements.lock.txt" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          foreach ($dep in $direct) {
            if ($locked -notcontains $dep) { throw "Python dependency lock is stale or missing direct dependency: $dep" }
          }
          Write-Host "Direct Python requirements are represented in lock."
      - name: Install locked CAD MCP dependencies
        run: python -m pip install -r runtimes/cad-mcp/requirements.lock.txt
      - name: Validate Python dependency graph
        run: python -m pip check
      - name: Compile CAD MCP slice
        run: python -m compileall -q runtimes/cad-mcp scripts/generate-cad-tool-manifest.py
      - name: Generate CAD tool manifest without starting runtime
        run: python scripts/generate-cad-tool-manifest.py
      - name: Import CAD MCP entrypoint
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\runtimes\cad-mcp"
          python -c "import main; print('cad-mcp import ok')"
