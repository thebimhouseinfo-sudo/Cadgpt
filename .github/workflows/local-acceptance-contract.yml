name: CadGPT Local Acceptance Contract

on:
  pull_request:
    branches: [main]

jobs:
  acceptance-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse acceptance and launcher PowerShell
        shell: pwsh
        run: |
          foreach ($script in @("acceptance.ps1", "doctor.ps1", "start.ps1", "openai-tunnel.ps1")) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell parse failed: $script"
            }
            Write-Host "PowerShell parse OK: $script"
          }

      - name: Verify BAT-first acceptance entrypoints
        shell: pwsh
        run: |
          foreach ($file in @("setup.bat", "run.bat", "doctor.bat", "acceptance.bat")) {
            if (-not (Test-Path $file)) { throw "Missing required BAT entrypoint: $file" }
          }
          if ((Get-Content run.bat -Raw) -notmatch "CADGPT_NO_PAUSE") {
            throw "run.bat is not automation-safe for acceptance invocation"
          }

      - name: Verify safe AutoLISP smoke fixture contract
        shell: pwsh
        run: |
          $path = "lisp/_cadgpt-system/CADGPT_LOAD_SMOKE.lsp"
          if (-not (Test-Path $path)) { throw "Missing AutoLISP smoke fixture" }
          $source = Get-Content $path -Raw
          foreach ($required in @(
            "TBH-HEADER-START",
            "TBH-HEADER-END",
            "File        : CADGPT_LOAD_SMOKE.lsp",
            "Command     : CADGPT_LOAD_SMOKE",
            "(vl-load-com)",
            "(defun c:CADGPT_LOAD_SMOKE",
            "(princ)"
          )) {
            if (-not $source.Contains($required)) { throw "Smoke fixture missing: $required" }
          }
          if ($source -match "\(command\b|\(entdel\b|\.Delete\(|vla-delete") {
            throw "Smoke fixture contains a mutating/destructive primitive"
          }
          Write-Host "Safe AutoLISP smoke fixture contract OK"
