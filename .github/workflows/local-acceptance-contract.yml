name: CadGPT Local Acceptance Contract

on:
  pull_request:
    branches: [main]

jobs:
  acceptance-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse acceptance and launcher PowerShell
        shell: pwsh
        run: |
          foreach ($script in @("acceptance.ps1", "doctor.ps1", "start.ps1", "openai-tunnel.ps1", "agent-task.ps1")) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell parse failed: $script"
            }
            Write-Host "PowerShell parse OK: $script"
          }

      - name: Verify driver-style acceptance entrypoints
        shell: pwsh
        run: |
          foreach ($file in @("setup.bat", "run.bat", "doctor.bat", "acceptance.bat", "agent-task.ps1")) {
            if (-not (Test-Path $file)) { throw "Missing required entrypoint: $file" }
          }
          $run = Get-Content run.bat -Raw
          foreach ($action in @("install", "start", "stop", "restart", "status", "uninstall")) {
            if ($run -notmatch [regex]::Escape($action)) { throw "run.bat missing driver action: $action" }
          }
          if ($run -notmatch "agent-task\.ps1") { throw "run.bat does not delegate to background-agent controller" }
          $setup = Get-Content setup.bat -Raw
          if ($setup -notmatch 'run\.bat" install') { throw "setup.bat does not install background autostart task" }
          Write-Host "Driver-style BAT/background-agent contract OK"

      - name: Verify safe internal AutoLISP smoke fixture
        shell: pwsh
        run: |
          $path = "resources/cad/CADGPT_LOAD_SMOKE.lsp"
          if (-not (Test-Path $path)) { throw "Missing internal AutoLISP smoke fixture" }
          $source = Get-Content $path -Raw
          foreach ($required in @(
            "CADGPT-HEADER-START",
            "CADGPT-HEADER-END",
            "File         : CADGPT_LOAD_SMOKE.lsp",
            "Command      : CADGPT_LOAD_SMOKE",
            "(vl-load-com)",
            "(defun c:CADGPT_LOAD_SMOKE",
            "(princ)"
          )) {
            if (-not $source.Contains($required)) { throw "Smoke fixture missing: $required" }
          }
          if ($source -match "\(command\b|\(entdel\b|\.Delete\(|vla-delete") {
            throw "Smoke fixture contains a mutating/destructive primitive"
          }
          if ($source -match "TBH-HEADER") { throw "Internal CadGPT fixture must not use TBH header" }
          Write-Host "Safe internal AutoLISP smoke fixture contract OK"
