name: CadGPT Registry Contract

on:
  pull_request:
    branches: [main]

jobs:
  registry-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate bundled/internal ownership
        run: python scripts/validate-lisp-registry.py

      - name: Verify Internal Registry dynamically exposes bundled Lisp
        shell: pwsh
        run: |
          $source = Get-Content "src/cadgpt/tools/registry.ts" -Raw
          foreach ($marker in @('registry: "internal"', 'listBundledLispEntries', 'resolveBundledLispPath', 'getUserCapabilitiesPath')) {
            if ($source -notmatch [regex]::Escape($marker)) {
              throw "Registry ownership generator missing: $marker"
            }
          }

          $bundle = Get-ChildItem "resources/cad/internal-lisp/tbh-toolkit" -Recurse -File | Where-Object { $_.Extension -match '^(?i)\.lsp$' }
          if (@($bundle).Count -ne 63) { throw "Expected 63 internal TBH Lisp files, got $(@($bundle).Count)" }

          foreach ($forbidden in @("appdata/libraries", "appdata/registry", "appdata/workspace", "appdata/runtime", "appdata/data")) {
            if (Test-Path -LiteralPath $forbidden) {
              throw "Repository must not ship runtime/user AppData content: $forbidden"
            }
          }
          Write-Host "Internal bundled Lisp / runtime User AppData ownership contract OK"
